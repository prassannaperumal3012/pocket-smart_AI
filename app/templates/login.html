{% extends "base.html" %}

{% block title %}
Login — PocketSmart AI
{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>
        Welcome back
    </h1>

    <p>
        Sign in to save and revisit
        recommendation plans.
    </p>

    <form id="login-form">

        <label>

            Email

            <input
                type="email"
                name="email"
                required
            >

        </label>


        <label>

            Password

            <input
                type="password"
                name="password"
                required
            >

        </label>


        <button
            class="button"
            type="submit"
        >
            Login
        </button>


        <div
            id="form-error"
            class="error"
        ></div>

    </form>


    <p class="muted">

        No account?

        <a href="/register">
            Create one
        </a>

    </p>

</div>

{% endblock %}


{% block scripts %}

<script>
    bindLogin();
</script>

{% endblock %}
